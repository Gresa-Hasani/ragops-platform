# RAGOps local stack.
#
#   docker compose up -d --build           # postgres + qdrant + backend
#   docker compose up -d postgres qdrant   # infrastructure only (run the API locally)
#
# Host ports are configurable via .env to avoid clashes with services already running
# on the host (see .env.example). The frontend service is added in Phase 10.
# Ollama is not part of this file: it runs on the host by default (see README).

name: ragops

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ragops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragops}
      POSTGRES_DB: ${POSTGRES_DB:-ragops}
    ports:
      - "${POSTGRES_HOST_PORT:-5442}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The image has no curl/wget; use bash's /dev/tcp to probe the readiness endpoint.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      RAGOPS_ENVIRONMENT: ${RAGOPS_ENVIRONMENT:-local}
      RAGOPS_LOG_LEVEL: ${RAGOPS_LOG_LEVEL:-INFO}
      RAGOPS_LOG_FORMAT: ${RAGOPS_LOG_FORMAT:-json}
      RAGOPS_CORS_ORIGINS: ${RAGOPS_CORS_ORIGINS:-http://localhost:3000}
      RAGOPS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ragops}:${POSTGRES_PASSWORD:-ragops}@postgres:5432/${POSTGRES_DB:-ragops}
      RAGOPS_QDRANT_URL: http://qdrant:6333
    ports:
      - "${BACKEND_HOST_PORT:-8010}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  qdrant-data:
